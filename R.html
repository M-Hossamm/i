<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Love Envelope</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0a0312;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      touch-action: manipulation;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    /* طبقة الإضاءة الصغيرة المتمركِزة على الحرف فقط */
    .glow-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(circle at 50% 55%, rgba(255, 215, 0, 0.4) 0%, rgba(255, 215, 0, 0.1) 12%, rgba(10, 3, 18, 0) 28%);
      transition: opacity 0.5s ease-in-out;
      opacity: 1;
      z-index: 2;
    }

    /* إخفاء الإضاءة تماماً عند فتح الظرف */
    .glow-overlay.hidden {
      opacity: 0;
    }

    .touch-hint {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      letter-spacing: 1px;
      pointer-events: none;
      animation: pulse 2s infinite;
      transition: opacity 0.5s ease;
      z-index: 3;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: translateX(-50%) scale(0.98); }
      50% { opacity: 0.8; transform: translateX(-50%) scale(1.02); }
    }
  </style>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- FontLoader & TextGeometry -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <div class="glow-overlay" id="glowOverlay"></div>
  <div id="canvas-container"></div>
  <div class="touch-hint" id="touchHint">المس الشاشة لفتح الظرف ✨</div>

  <script>
    const container = document.getElementById('canvas-container');
    const touchHint = document.getElementById('touchHint');
    const glowOverlay = document.getElementById('glowOverlay');
    const scene = new THREE.Scene();

    const isMobile = window.innerWidth < 768;
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, isMobile ? 12.5 : 11);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // الضوء الصغير المسلط على الحرف
    const smallSpotLight = new THREE.SpotLight(0xffffd0, 3, 12, Math.PI / 10, 0.5);
    smallSpotLight.position.set(0, -0.5, 4);
    scene.add(smallSpotLight);

    // --- Envelope Creation ---
    const envelopeGroup = new THREE.Group();
    scene.add(envelopeGroup);

    smallSpotLight.target = envelopeGroup;

    const envMaterial = new THREE.MeshStandardMaterial({
      color: 0xc62828,
      roughness: 0.3,
      metalness: 0.1,
      side: THREE.DoubleSide
    });

    const innerEnvMaterial = new THREE.MeshStandardMaterial({
      color: 0x8e0000,
      roughness: 0.5,
      side: THREE.DoubleSide
    });

    const goldMaterial = new THREE.MeshStandardMaterial({
      color: 0xffd700,
      roughness: 0.2,
      metalness: 0.8
    });

    // Back
    const backMesh = new THREE.Mesh(new THREE.PlaneGeometry(5, 3.4), innerEnvMaterial);
    backMesh.position.z = -0.05;
    envelopeGroup.add(backMesh);

    // Front Bottom Flap
    const bottomShape = new THREE.Shape();
    bottomShape.moveTo(-2.5, -1.7); bottomShape.lineTo(2.5, -1.7); bottomShape.lineTo(0, 0.1); bottomShape.closePath();
    const bottomMesh = new THREE.Mesh(new THREE.ShapeGeometry(bottomShape), envMaterial);
    bottomMesh.position.z = 0.08;
    envelopeGroup.add(bottomMesh);

    // Side Flaps
    const leftShape = new THREE.Shape();
    leftShape.moveTo(-2.5, -1.7); leftShape.lineTo(-2.5, 1.7); leftShape.lineTo(-0.2, 0); leftShape.closePath();
    const leftMesh = new THREE.Mesh(new THREE.ShapeGeometry(leftShape), envMaterial);
    leftMesh.position.z = 0.06;
    envelopeGroup.add(leftMesh);

    const rightShape = new THREE.Shape();
    rightShape.moveTo(2.5, -1.7); rightShape.lineTo(2.5, 1.7); rightShape.lineTo(0.2, 0); rightShape.closePath();
    const rightMesh = new THREE.Mesh(new THREE.ShapeGeometry(rightShape), envMaterial);
    rightMesh.position.z = 0.06;
    envelopeGroup.add(rightMesh);

    // Top Opening Flap
    const topFlapGroup = new THREE.Group();
    topFlapGroup.position.set(0, 1.7, 0.07);
    envelopeGroup.add(topFlapGroup);

    const topShape = new THREE.Shape();
    topShape.moveTo(-2.5, 0); topShape.lineTo(2.5, 0); topShape.lineTo(0, -1.8); topShape.closePath();
    const topMesh = new THREE.Mesh(new THREE.ShapeGeometry(topShape), envMaterial);
    topMesh.castShadow = true;
    topFlapGroup.add(topMesh);

    // Wax Seal Disc Base
    const sealBaseGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.04, 32);
    const sealBaseMesh = new THREE.Mesh(sealBaseGeo, goldMaterial);
    sealBaseMesh.rotation.x = Math.PI / 2;
    sealBaseMesh.position.set(0, -1.0, 0.03);
    topFlapGroup.add(sealBaseMesh);

    // --- Helper Heart Shape Generator ---
    const heartShape = new THREE.Shape();
    const x = 0, y = 0;
    heartShape.moveTo(x + 0.25, y + 0.25);
    heartShape.bezierCurveTo(x + 0.25, y + 0.25, x + 0.2, y, x, y);
    heartShape.bezierCurveTo(x - 0.3, y, x - 0.3, y + 0.35, x - 0.3, y + 0.35);
    heartShape.bezierCurveTo(x - 0.3, y + 0.55, x - 0.1, y + 0.77, x + 0.25, y + 0.95);
    heartShape.bezierCurveTo(x + 0.6, y + 0.77, x + 0.8, y + 0.55, x + 0.8, y + 0.35);
    heartShape.bezierCurveTo(x + 0.8, y + 0.35, x + 0.8, y, x + 0.5, y);
    heartShape.bezierCurveTo(x + 0.35, y, x + 0.25, y + 0.25, x + 0.25, y + 0.25);

    const heartGeo = new THREE.ExtrudeGeometry(heartShape, { depth: 0.08, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.02, bevelThickness: 0.02 });
    const redHeartMat = new THREE.MeshStandardMaterial({ color: 0xff1744, roughness: 0.2, metalness: 0.5, emissive: 0x880015, emissiveIntensity: 0.2 });
    const goldHeartMat = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.2, metalness: 0.9 });
    const pinkHeartMat = new THREE.MeshStandardMaterial({ color: 0xff4081, roughness: 0.2, metalness: 0.4 });

    // Floating 3D Hearts Particles Container
    const floatingHeartsGroup = new THREE.Group();
    scene.add(floatingHeartsGroup);

    const floatingHearts = [];
    const heartMaterials = [redHeartMat, goldHeartMat, pinkHeartMat];
    const heartCount = isMobile ? 20 : 25;

    for (let i = 0; i < heartCount; i++) {
      const mat = heartMaterials[i % heartMaterials.length];
      const mesh = new THREE.Mesh(heartGeo, mat);
      const scale = (0.12 + Math.random() * 0.22) * (isMobile ? 0.85 : 1);
      mesh.scale.set(scale, scale, scale);
      mesh.rotation.z = Math.PI;
      mesh.position.set(0, -1, 0);
      mesh.visible = false;
      
      floatingHeartsGroup.add(mesh);
      floatingHearts.push({
        mesh: mesh,
        baseX: (Math.random() - 0.5) * (isMobile ? 5.5 : 8),
        targetY: 1.2 + Math.random() * (isMobile ? 4.0 : 4.5),
        targetZ: 1 + Math.random() * 3,
        rotSpeedX: (Math.random() - 0.5) * 0.04,
        rotSpeedY: (Math.random() - 0.5) * 0.04,
        phase: Math.random() * Math.PI * 2
      });
    }

    // --- Font Loader for Text & Letter 'R' ---
    const fontLoader = new THREE.FontLoader();

    const textGroup = new THREE.Group();
    textGroup.position.set(0, -0.2, 0.02);
    textGroup.scale.set(0.001, 0.001, 0.001);
    scene.add(textGroup);

    fontLoader.load('https://threejs.org/examples/fonts/helvetiker_bold.typeface.json', (font) => {
      // 1. الحرف "R"
      const rGeo = new THREE.TextGeometry('R', {
        font: font,
        size: 0.45,
        height: 0.05,
        curveSegments: 12,
        bevelEnabled: true,
        bevelThickness: 0.01,
        bevelSize: 0.01,
        bevelSegments: 3
      });
      rGeo.center();
      const rMesh = new THREE.Mesh(rGeo, new THREE.MeshStandardMaterial({
        color: 0x8e0000,
        roughness: 0.2,
        metalness: 0.3
      }));
      rMesh.position.set(0, -1.0, 0.06);
      topFlapGroup.add(rMesh);

      // 2. النص "I Love You"
      const textSize = isMobile ? 0.65 : 0.9;
      const textGeo = new THREE.TextGeometry('I Love You', {
        font: font,
        size: textSize,
        height: 0.18,
        curveSegments: 12,
        bevelEnabled: true,
        bevelThickness: 0.03,
        bevelSize: 0.02,
        bevelOffset: 0,
        bevelSegments: 4
      });

      textGeo.center();

      const textMaterial = new THREE.MeshStandardMaterial({
        color: 0xff1744,
        emissive: 0xd50000,
        emissiveIntensity: 0.3,
        roughness: 0.1,
        metalness: 0.8
      });

      const textMesh = new THREE.Mesh(textGeo, textMaterial);
      textMesh.castShadow = true;
      textGroup.add(textMesh);

      // Side Permanent Gold Hearts
      const heartScale = isMobile ? 0.25 : 0.35;
      const heartOffset = isMobile ? -2.4 : -3.2;

      const leftHeart = new THREE.Mesh(heartGeo, goldHeartMat);
      leftHeart.scale.set(heartScale, heartScale, heartScale);
      leftHeart.rotation.z = Math.PI;
      leftHeart.position.set(heartOffset, -0.2, 0);
      textGroup.add(leftHeart);

      const rightHeart = leftHeart.clone();
      rightHeart.position.set(-heartOffset, -0.2, 0);
      textGroup.add(rightHeart);
    });

    // Envelope Initial Pose
    envelopeGroup.rotation.x = 0.2;
    envelopeGroup.rotation.y = -0.2;

    let isOpen = false;
    let isAnimating = false;

    gsap.to(envelopeGroup.position, {
      y: 0.2,
      duration: 2.2,
      repeat: -1,
      yoyo: true,
      ease: "sine.inOut"
    });

    let targetRotX = 0.2;
    let targetRotY = -0.2;

    function handlePointerMove(x, y) {
      if (isOpen) return;
      const normX = (x / window.innerWidth) * 2 - 1;
      const normY = -(y / window.innerHeight) * 2 + 1;
      targetRotY = normX * 0.4;
      targetRotX = -normY * 0.25 + 0.2;
    }

    window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    function animateHearts() {
      if (!isOpen) return;
      floatingHearts.forEach(h => {
        h.phase += 0.03;
        h.mesh.position.x = h.baseX + Math.sin(h.phase) * 0.25;
        h.mesh.rotation.y += h.rotSpeedY;
        h.mesh.rotation.x += h.rotSpeedX;
      });
    }

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      if (!isOpen) {
        envelopeGroup.rotation.y += (targetRotY - envelopeGroup.rotation.y) * 0.05;
        envelopeGroup.rotation.x += (targetRotX - envelopeGroup.rotation.x) * 0.05;
      } else {
        textGroup.rotation.y = Math.sin(Date.now() * 0.002) * 0.12;
        textGroup.rotation.x = Math.cos(Date.now() * 0.0015) * 0.06;
        animateHearts();
      }
      renderer.render(scene, camera);
    }
    renderLoop();

    // Toggle Action Function
    function toggleEnvelope() {
      if (isAnimating) return;
      isAnimating = true;

      if (touchHint) touchHint.style.opacity = '0';

      if (!isOpen) {
        // إخفاء النور الصغير وخليته يختفي تماماً
        glowOverlay.classList.add('hidden');
        gsap.to(smallSpotLight, { intensity: 0, duration: 0.5 });

        const timeline = gsap.timeline({
          onComplete: () => { isAnimating = false; isOpen = true; }
        });

        timeline.to(envelopeGroup.rotation, {
          x: 0.1, y: 0, z: 0, duration: 0.7, ease: "power2.out"
        });

        timeline.to(topFlapGroup.rotation, {
          x: Math.PI, duration: 0.8, ease: "back.out(1.2)"
        }, "-=0.2");

        timeline.to(envelopeGroup.position, {
          y: isMobile ? -2.4 : -2.2, duration: 0.9, ease: "power2.out"
        }, "-=0.5");

        timeline.to(textGroup.position, {
          y: isMobile ? 1.1 : 0.8, z: 2.0, duration: 1.1, ease: "back.out(1.5)"
        }, "-=0.7");

        timeline.to(textGroup.scale, {
          x: 1, y: 1, z: 1, duration: 1.1, ease: "back.out(1.5)"
        }, "-=1.1");

        floatingHearts.forEach((h, index) => {
          h.mesh.visible = true;
          h.mesh.position.set(0, -1, 0.5);
          gsap.to(h.mesh.position, {
            x: h.baseX,
            y: h.targetY,
            z: h.targetZ,
            duration: 1.3 + Math.random() * 0.8,
            delay: 0.4 + index * 0.03,
            ease: "power2.out"
          });
        });

        setTimeout(() => {
          confetti({
            particleCount: isMobile ? 80 : 120,
            spread: isMobile ? 90 : 120,
            origin: { y: 0.55 },
            colors: ['#ff1744', '#ffd700', '#ffffff', '#ff4081']
          });
        }, 800);

      } else {
        // إعادة النور الصغير عند إعادة غلق الظرف
        glowOverlay.classList.remove('hidden');
        gsap.to(smallSpotLight, { intensity: 3, duration: 0.6 });

        const timeline = gsap.timeline({
          onComplete: () => {
            isAnimating = false;
            isOpen = false;
            floatingHearts.forEach(h => h.mesh.visible = false);
            if (touchHint) touchHint.style.opacity = '1';
          }
        });

        floatingHearts.forEach(h => {
          timeline.to(h.mesh.position, { x: 0, y: -1, z: 0, duration: 0.4, ease: "power2.in" }, 0);
        });

        timeline.to(textGroup.scale, { x: 0.001, y: 0.001, z: 0.001, duration: 0.5, ease: "power2.in" }, 0);
        timeline.to(textGroup.position, { y: -0.2, z: 0.02, duration: 0.5, ease: "power2.in" }, 0);
        timeline.to(envelopeGroup.position, { y: 0, duration: 0.7, ease: "power2.inOut" }, "-=0.3");
        timeline.to(topFlapGroup.rotation, { x: 0, duration: 0.6, ease: "power2.inOut" }, "-=0.2");
      }
    }

    container.addEventListener('click', toggleEnvelope);

    window.addEventListener('resize', () => {
      const mobileCheck = window.innerWidth < 768;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.fov = mobileCheck ? 55 : 45;
      camera.position.z = mobileCheck ? 12.5 : 11;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
